<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recomposição URE-SAT</title><style>:root{--b:#0647a6;--b2:#0e69db;--i:#17365f;--m:#738198;--l:#dfe6ef;--bg:#f6f9fc}*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--i)}button,input,select{font:inherit}.shell{width:min(1480px,calc(100% - 40px));margin:auto}.head{height:76px;background:#fff;border-bottom:1px solid #e7edf4;display:flex;align-items:center;padding:0 28px;position:sticky;top:0;z-index:20}.head img{width:210px}.nav{margin-left:auto;display:flex;gap:18px;align-items:center}.nav button{border:0;background:none;font-weight:800;color:var(--i)}.nav .adm{border:2px solid var(--b);border-radius:14px;padding:11px 16px;color:var(--b)}.hero{background:#edf3fb;padding:18px 0 85px}.carousel{height:480px;border-radius:28px;overflow:hidden;position:relative;background:#104a96}.slide{position:absolute;inset:0;opacity:0;transition:.4s}.slide.on{opacity:1}.slide img{width:100%;height:100%;object-fit:cover}.arr{position:absolute;top:50%;transform:translateY(-50%);z-index:3;width:48px;height:48px;border:0;border-radius:50%;background:#fff;color:var(--b);font-size:28px}.prev{left:18px}.next{right:18px}.search{width:min(1050px,calc(100% - 70px));margin:-42px auto 0;background:#fff;border-radius:20px;padding:14px;display:flex;gap:12px;box-shadow:0 18px 40px #06346d22;position:relative;z-index:3}.search input{flex:1;border:1px solid var(--l);border-radius:999px;padding:13px 17px}.search button{border:0;border-radius:999px;background:var(--b2);color:#fff;padding:0 24px;font-weight:900}.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding:24px 0}.quick button{border:1px solid var(--l);background:#fff;border-radius:17px;padding:16px;min-height:170px}.quick img{width:84px;height:84px;object-fit:contain}.quick h3{margin:8px 0 5px}.quick p{font-size:11px;color:var(--m);margin:0;line-height:1.4}.lib{background:#fff;border:1px solid var(--l);border-radius:22px;padding:24px;margin-bottom:30px}.lib h2{margin:4px 0}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid var(--l);background:#f7f9fc;border-radius:11px;padding:10px 15px;font-weight:800;color:#52647e}.tabs button.on{background:var(--b);color:#fff}.filters{display:grid;grid-template-columns:1fr 180px 180px 110px;gap:9px}.filters input,.filters select{border:1px solid var(--l);border-radius:10px;padding:11px}.group{margin-top:18px;padding:20px;border:1px solid var(--l);border-radius:18px}.official{background:#f8fbff}.author{background:#fffaf1}.section{margin-top:20px}.section h3{margin:5px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{display:flex;background:#fff;border:1px solid var(--l);border-radius:16px;overflow:hidden;min-height:165px}.cover{width:100px;min-width:100px;margin:12px;border-radius:11px;overflow:hidden;background:#f5f7fa;position:relative}.cover img{width:100%;height:100%;object-fit:contain;background:#fff}.badge{position:absolute;left:6px;top:6px;background:var(--b);color:#fff;border-radius:99px;padding:4px 6px;font-size:7px;font-weight:900}.aut{background:#ef8a00}.ct{padding:13px 13px 13px 0;display:flex;flex-direction:column;flex:1}.ct small{font-size:8px;font-weight:900;color:#687a92}.ct h4{margin:6px 0;font-size:13px}.ct p{font-size:9.5px;color:var(--m);line-height:1.45;margin:0 0 8px}.meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:auto}.meta span{font-size:7.5px;background:#eef3f8;border-radius:6px;padding:4px 6px}.ct a{margin-top:10px;text-decoration:none;text-align:center;background:var(--b2);color:#fff;padding:8px;border-radius:8px;font-size:9px;font-weight:900}.notice{background:#fff7d7;color:#6b5300;padding:10px;text-align:center}.err{background:#ffecea;color:#a43a31;padding:12px;border-radius:10px;margin:18px 0}.hidden{display:none!important}.login{position:fixed;inset:0;background:#041430c9;display:none;align-items:center;justify-content:center;z-index:50;padding:20px}.login.open{display:flex}.box{width:min(460px,100%);background:#fff;border-radius:20px;padding:26px}.box button{width:100%;padding:13px;border:1px solid var(--l);border-radius:10px;background:#fff;font-weight:900}@media(max-width:980px){.quick,.grid{grid-template-columns:repeat(2,1fr)}.filters{grid-template-columns:1fr 1fr}}@media(max-width:650px){.shell{width:calc(100% - 20px)}.head{padding:0 10px}.head img{width:155px}.nav button:not(.adm){display:none}.carousel{height:390px;border-radius:16px}.search{width:calc(100% - 20px);flex-direction:column}.quick,.grid,.filters{grid-template-columns:1fr}.card{flex-direction:column}.cover{width:90px;height:120px;margin:14px auto}.ct{padding:0 14px 14px}}</style></head><body><header class="head"><img src="https://recomposicao-ure-sat-1p0ilj.v2.appdeploy.ai/resources/logo-sistema.png"><nav class="nav"><button onclick="go('inicio')">Início</button><button onclick="go('materiais')">Materiais</button><button class="adm" id="adm">Área do Admin</button></nav></header><div id="notice"></div><section class="hero" id="inicio"><div class="shell"><div class="carousel" id="carousel"><button class="arr prev" id="prev">‹</button><button class="arr next" id="next">›</button></div></div><div class="search"><input id="q" placeholder="Busque por material, programa ou estratégia..."><button id="buscar">Buscar</button></div></section><section class="quick shell" id="quick"></section><section class="lib shell" id="materiais"><small>MATERIAIS</small><h2>Escolha entre o acervo oficial e as produções autorais e adaptadas.</h2><div class="tabs"><button class="on" data-mode="todos">Todos</button><button data-mode="oficial">Materiais Oficiais</button><button data-mode="autoral">Materiais Autorais e Adaptados</button></div><div class="filters"><input id="f" placeholder="Buscar por material, programa ou tema..."><select id="c"><option>Todos</option><option>Língua Portuguesa</option><option>Matemática</option><option>Geral</option></select><select id="p"><option>Todos</option><option>Professor</option><option>Estudante</option><option>gestão</option></select><span id="count"></span></div><section class="group official"><b>MATERIAIS OFICIAIS</b><h3>Acervo institucional</h3><div id="official"></div></section><section class="group author"><b>MATERIAIS AUTORAIS E ADAPTADOS</b><h3>Produções e adaptações</h3><div id="author"></div></section></section><div class="login" id="login"><div class="box"><h2>Área Administrativa</h2><p>Entre com a conta administrativa autorizada.</p><button id="google">Continuar com Google</button><button id="fechar">Fechar</button></div></div><script>const SB='https://iktsmqywgepivwzjrmws.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlrdHNtcXl3Z2VwaXZ3empybXdzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MjMxOTYsImV4cCI6MjEwNDI5OTE5Nn0.G4mNPLxRkY6Ja5z1iSvvyEiRAsxCTTrpXcJm3UdtTN8';let M=[],H=[],Q=[],S=[],mode='todos',ix=0;const $=x=>document.getElementById(x),e=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function go(id){$(id).scrollIntoView({behavior:'smooth'})}function cover(r){return r.cover_url||r.cover||r.thumbnail_url||(r.id?'https://drive.google.com/thumbnail?id='+r.id+'&sz=w1000':'')}function url(r){return r.url||(r.id?'https://drive.google.com/file/d/'+r.id+'/view':'#')}function hero(){const h=$('carousel');h.querySelectorAll('.slide').forEach(x=>x.remove());const list=H.filter(x=>x.is_active!==false&&x.visible!==false);if(ix>=list.length)ix=0;list.forEach((x,i)=>{const d=document.createElement(x.url?'a':'div');d.className='slide'+(i===ix?' on':'');if(x.url){d.href=x.url;d.target='_blank'}const im=document.createElement('img');im.src=x.cover_url||x.src||'';im.alt=x.alt||x.title||'Banner';d.appendChild(im);h.insertBefore(d,$('prev'))})}function quick(){const h=$('quick');h.innerHTML='';Q.filter(x=>x.is_active!==false&&x.visible!==false).forEach(x=>{const b=document.createElement('button');if(x.icon_url){const im=document.createElement('img');im.src=x.icon_url;b.appendChild(im)}const t=document.createElement('h3');t.textContent=x.title||'';const p=document.createElement('p');p.textContent=x.text||'';b.append(t,p);b.onclick=()=>search(x.term||x.title||'');h.appendChild(b)})}function card(r){return '<article class="card" data-g="'+e(r.g||'')+'" data-c="'+e(r.c||'')+'" data-p="'+e(r.p||'')+'" data-text="'+e([r.t,r.a,r.c,r.k,r.p,r.d].filter(Boolean).join(' ').toLowerCase())+'"><div class="cover">'+(cover(r)?'<img src="'+e(cover(r))+'">':'')+'<span class="badge '+(r.g==='oficial'?'':'aut')+'">'+e(r.g==='oficial'?'OFICIAL':String(r.k||'ADAPTADO').toUpperCase())+'</span></div><div class="ct"><small>'+e(r.a||'')+'</small><h4>'+e(r.t||'')+'</h4><p>'+e(r.d||'')+'</p><div class="meta"><span>'+e(r.c||'Geral')+'</span><span>'+e(r.k||'')+'</span><span>'+e(r.p||'')+'</span></div><a target="_blank" href="'+e(url(r))+'">Abrir material</a></div></article>'}function group(type,id){let out='';S.filter(s=>s.is_active!==false&&s.visible!==false).forEach(s=>{const items=M.filter(r=>r.g===type&&r.section===s.id&&r.is_active!==false&&r.visible!==false);if(!items.length)return;out+='<section class="section"><small>'+e(s.badge||'')+'</small><h3>'+e(s.title||'')+'</h3><p>'+e(s.subtitle||'')+'</p><div class="grid">'+items.map(card).join('')+'</div></section>'});$(id).innerHTML=out}function materials(){group('oficial','official');group('autoral','author');filter()}function filter(){const q=$('f').value.toLowerCase(),c=$('c').value,p=$('p').value;let n=0;document.querySelectorAll('.card').forEach(x=>{const ok=(mode==='todos'||x.dataset.g===mode)&&(!q||x.dataset.text.includes(q))&&(c==='Todos'||x.dataset.c===c)&&(p==='Todos'||(x.dataset.p||'').toLowerCase().includes(p.toLowerCase()));x.style.display=ok?'flex':'none';if(ok)n++});document.querySelector('.official').style.display=mode==='autoral'?'none':'block';document.querySelector('.author').style.display=mode==='oficial'?'none':'block';$('count').textContent=n+' encontrados'}function search(q){$('f').value=q;go('materiais');setTimeout(filter,50)}async function load(){try{const r=await fetch(SB+'/rest/v1/portal_content?select=key,value&key=in.(materials,hero,quick,notice,sections)',{headers:{apikey:K,Authorization:'Bearer '+K}});if(!r.ok)throw Error(r.status);const rows=await r.json(),g=k=>rows.find(x=>x.key===k)?.value;M=Array.isArray(g('materials'))?g('materials'):[];H=Array.isArray(g('hero'))?g('hero'):[];Q=Array.isArray(g('quick'))?g('quick'):[];S=Array.isArray(g('sections'))?g('sections'):[];const N=g('notice')||{};if(N.enabled){$('notice').className='notice';$('notice').textContent=(N.title?N.title+': ':'')+(N.text||'')}hero();quick();materials()}catch(err){$('notice').className='notice';$('notice').innerHTML='<div class="err">Erro ao carregar os dados do portal.</div>'}}$('prev').onclick=()=>{if(H.length){ix=(ix-1+H.length)%H.length;hero()}};$('next').onclick=()=>{if(H.length){ix=(ix+1)%H.length;hero()}};$('buscar').onclick=()=>search($('q').value);$('f').oninput=filter;$('c').onchange=filter;$('p').onchange=filter;document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x===b));filter()});$('adm').onclick=()=>$('login').classList.add('open');$('fechar').onclick=()=>$('login').classList.remove('open');$('google').onclick=()=>location.assign(SB+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(location.href));load();</script></body></html>
