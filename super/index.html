.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.card{position:relative;min-height:145px;border-radius:16px;padding:20px 18px;color:#fff;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 22px rgba(24,80,130,.10);overflow:hidden}.card:after{content:"▥";position:absolute;right:20px;bottom:14px;font-size:40px;opacity:.22}.card:nth-child(2):after{content:"●●";font-size:25px}.card:nth-child(3):after{content:"◎"}.card:nth-child(4):after{content:"↘"}.card:nth-child(5):after{content:"▥"}.card b{font-size:42px;line-height:1}.card span{font-size:11px;font-weight:900;margin-top:12px}.card:nth-child(1){background:linear-gradient(135deg,#0870e7,#0061cb)}.card:nth-child(2){background:linear-gradient(135deg,#2bc9a6,#00a97d)}.card:nth-child(3){background:linear-gradient(135deg,#ffc635,#ffb318);color:#3c2b00}.card:nth-child(4){background:linear-gradient(135deg,#ff6871,#fa4250)}.card:nth-child(5){background:linear-gradient(135deg,#7c50ec,#5833d7)}
.panel{background:#fff;border:1px solid #dbeaf6;border-radius:18px;padding:22px;margin:20px 0;box-shadow:var(--shadow)}.panel h2{margin:0 0 7px;color:#0b2d70;font-size:29px;letter-spacing:-.03em}.panel>p{margin:0 0 18px;color:#6079ad;font-size:12px}.tablewrap{overflow:auto;border:1px solid #d9e7f3;border-radius:12px}.tablewrap table{border-collapse:collapse;width:100%;min-width:1000px}.tablewrap th{background:#eef7ff;color:#153e75;font-size:9px;text-transform:uppercase}.tablewrap td{font-size:10px;color:#24486d}.tablewrap th,.tablewrap td{padding:10px;border-bottom:1px solid #e7edf3;text-align:left}.flag{display:inline-block;padding:5px 8px;border-radius:99px;font-size:9px;font-weight:900;background:#eef4f8}.flag.bad{background:#ffe8ea;color:#b3333d}.flag.good{background:#e9f8f1;color:#16714f}.sourcegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.source{border:1px solid #dfe9f2;border-radius:12px;padding:14px;background:#fbfdff}.source b{display:block;font-size:20px}.criteria{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.criteria label{border:1px solid #dfe9f2;border-radius:12px;padding:14px;background:#fbfdff;display:flex;flex-direction:column;gap:7px;font-size:10px;font-weight:800}.criteria input,.criteria select{height:38px;border:1px solid #cfe1ef;border-radius:8px;padding:0 8px;background:#fff}.actions{display:flex;gap:9px;flex-wrap:wrap;margin:14px 0}.actions button{height:40px}.muted{color:#7b8d9e}.empty{text-align:center;padding:32px;color:#73869a}

.trace{font-size:10px}.trace summary{cursor:pointer;color:#0870e7;font-weight:900}.trace div{min-width:230px;padding:8px 0;line-height:1.7;color:#405b83}.muted{color:#8798a6}.oktxt{color:#16805b;font-weight:800}.badtxt{color:#c83d49;font-weight:800}.source-table td:first-child{font-weight:900;color:#0b2d70}.fixed{background:#eef7ff!important;color:#0b2d70!important;font-weight:900}.toolbar .capture-source{min-width:230px}</style>

<body>
<div class="shell">
<aside class="side"><div class="brand"><div><b>SDF</b><span>SUPER DIAGNÓSTICO FÁCIL</span><small>URE - SAT</small></div></div><div class="nav" id="nav"></div><button class="collapseBtn" id="collapseBtn"><span>Recolher menu</span></button></aside>
<main class="main"><header class="top"><strong>URE-SAT · Recomposição</strong><button id="openPortalBtn" style="height:42px;border:0;border-radius:999px;padding:0 18px;background:linear-gradient(135deg,#0a75e7,#005fcf);color:#fff;font-weight:900;cursor:pointer">Abrir Escola Total</button><span class="pill" id="connector">🔌 Aguardando conector</span><span class="pill" id="schoolsPill">🏫 0 escolas</span></header><section class="hero"><small>SUPER DIAGNÓSTICO FÁCIL · 2026</small><h1>Da escola para a URE.<br><span>Um diagnóstico consolidado.</span></h1><p>AvD, frequência, Prova Paulista e SARESP em uma única visão regional.</p><div class="heroVisual" aria-hidden="true"><i class="bar b1"></i><i class="bar b2"></i><i class="bar b3"></i><i class="bar b4"></i><i class="arrow"></i></div></section><div id="app"></div></main>
</div>
<script>
const tabs=[['panorama','Panorama URE'],['escolas','Escolas'],['turmas','Turmas'],['prioritarios','Prioritários'],['capturas','Capturas por turma'],['fontes','Fontes e cobertura'],['criterios','Critérios']];
const state={tab:'panorama',schools:{},criteria:{avd:'below',frequency:75,pp:50,saresp:4,priority:2.5},filters:{school:'',grade:'',subject:'math',priority:'prioritarios',level:'',points:'',captureSource:'avd'},connector:'',session:{loggedIn:false,currentSchool:'',currentTurma:'',currentUre:''},captureNotice:''};
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const fold=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
const digits=v=>clean(v).replace(/\D/g,'');
const fmt=v=>v==null||Number.isNaN(v)?'—':Number(v).toFixed(1).replace('.',',')+'%';
const num=v=>{if(v===null||v===undefined||v==='')return null;const raw=clean(v);let n=typeof v==='number'?v:Number(raw.replace('%','').replace(',','.').replace(/[^0-9.-]/g,''));if(!Number.isFinite(n))return null;if(!raw.includes('%')&&Math.abs(n)<=1)n*=100;return n};
const find=(r,names)=>{const e=Object.entries(r||{});for(const n of names){const f=fold(n),h=e.find(([k,v])=>fold(k)===f&&clean(v)!=='');if(h)return h[1]}for(const n of names){const f=fold(n),h=e.find(([k,v])=>f.length>2&&fold(k).includes(f)&&clean(v)!=='');if(h)return h[1]}return''};
const level=v=>{const f=fold(v);if(f.includes('ABAIXO'))return'Abaixo do Básico';if(f.includes('PROFICIENTE')||f.includes('ADEQUADO')||f.includes('AVANCADO'))return'Proficiente';if(f.includes('BASICO'))return'Básico';return clean(v)};
function canonicalKey(k,d){const m=fold(`${k} ${d?.key||''} ${d?.label||''}`);if(m==='AVD'||m.includes('RECOMPOSICAO DIAGNOSTICO')||m.includes('AVALIACAO DIAGNOSTICA')||m.includes('DIAGNOSTICAS'))return'avd';if(m.includes('PP1')||m.includes('PROVA PAULISTA 1'))return'pp1';if(m.includes('PP2')||m.includes('PROVA PAULISTA 2'))return'pp2';if(m.includes('PP3')||m.includes('PROVA PAULISTA 3'))return'pp3';if(m.includes('ALUNO PRESENTE')||m.includes('PRESENCA')||m.includes('FREQUENCIA'))return'presenca';if(m.includes('SARESP'))return'saresp';if(m.includes('DIAGNOSTICA 1')||m.includes('AVD 1')||m.includes('AVD1'))return'diagnostica1';if(m.includes('DIAGNOSTICA 2')||m.includes('AVD 2')||m.includes('AVD2'))return'diagnostica2';return k}
function datasets(input){const out={};Object.entries(input||{}).forEach(([k,d])=>{if(d&&Array.isArray(d.rows)){const c=canonicalKey(k,d);if(out[c]&&c==='avd')out[c]={...out[c],rows:[...(out[c].rows||[]),...(d.rows||[])]};else out[c]={...d,key:c}}});return out}
function infer(s){return clean(s?.schoolName)||clean(s?.context?.school)||clean(s?.studentRows?.[0]?.school)||clean(Object.values(s?.datasets||{}).flatMap(d=>d?.rows||[])[0]?._selectedSchool)}
function sourceValues(r){return Object.entries(r||{}).filter(([k])=>!String(k).startsWith('__')&&!String(k).startsWith('_')).map(([,v])=>v)}
function cell(r,idx){const a=sourceValues(r);return a[idx]??''}
function ra12(v){return digits(v).slice(0,12)}
function avdRows(s){const d=datasets(s.datasets);if(d.avd?.rows?.length)return d.avd.rows;if(d.diagnostica1?.rows?.length&&d.diagnostica2?.rows?.length){const m=new Map;for(const r of d.diagnostica1.rows){const ra=ra12(find(r,['NR RA','RA','Registro do Aluno','Matrícula'])||cell(r,1));if(ra)m.set(ra,{...r})}for(const r of d.diagnostica2.rows){const ra=ra12(find(r,['NR RA','RA','Registro do Aluno','Matrícula'])||cell(r,1));if(ra)m.set(ra,{...(m.get(ra)||{}),...r})}return[...m.values()]}return[]}
function rebuild(s){const sc=infer(s),rows=avdRows(s),m=new Map;let order=0;if(rows.length){for(const r of rows){const ra=ra12(find(r,['NR RA','RA','Registro do Aluno','Matrícula'])||cell(r,1));const name=clean(find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome'])||cell(r,2));if(!ra&&!name)continue;const turma=clean(r._selectedTurma||find(r,['Turma','Classe','Turma Consolidado'])||s?.context?.turma||'');const k=ra||fold(name)+'|'+fold(turma);if(!m.has(k))m.set(k,{school:sc,turma,ra,estudante:name,_avdRow:r,_order:order++})}return[...m.values()]}for(const r of s.studentRows||[]){const ra=ra12(r.ra||find(r,['NR RA','RA','Registro do Aluno','Matrícula']));const name=clean(r.estudante||find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome']));if(!ra&&!name)continue;const turma=clean(r.turma||r._selectedTurma||find(r,['Turma','Classe','Turma Consolidado']));const k=ra||fold(name)+'|'+fold(turma);if(!m.has(k))m.set(k,{...r,school:clean(r.school)||sc,ra,estudante:name,turma,_order:order++})}return[...m.values()]}
function matchingRows(s,k,st){const rows=datasets(s.datasets)[k]?.rows||[],ra=ra12(st.ra),nm=fold(st.estudante),tu=fold(st.turma);return rows.filter(r=>{const values=sourceValues(r);const rr=ra12(find(r,['NR RA','RA','Registro do Aluno','Matrícula'])||cell(r,0));const rn=fold(find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome'])||cell(r,0));const rt=fold(find(r,['Turma','Classe','Turma Consolidado']));return ra&&rr?ra===rr:(nm&&rn===nm&&(!rt||!tu||rt===tu))})}
function subjectMatches(r,subject){const c=fold(find(r,['Componente','Disciplina','Área','Componente Curricular']));return !c||(subject==='math'?c.includes('MATEM'):c.includes('PORTUG'))}
function diagRaw(s,st,subject,p){const pre=subject==='math'?'math':'lp',prop=p===1?`${pre}Av1Nivel`:`${pre}Av2Nivel`;const legacy=clean(st[prop]||st[prop.replace('Nivel','')]);if(legacy)return legacy;const r=st._avdRow||matchingRows(s,'avd',st)[0];if(!r)return'';const aliases=subject==='math'?(p===1?['1ª AvD Matemática','AvD 1 Matemática','Matemática AvD1']:['2ª AvD Matemática','AvD 2 Matemática','Matemática AvD2']):(p===1?['1ª AvD Língua Portuguesa','AvD 1 Língua Portuguesa','Português AvD1']:['2ª AvD Língua Portuguesa','AvD 2 Língua Portuguesa','Português AvD2']);const named=clean(find(r,aliases));if(named)return named;const idx=subject==='math'?(p===1?8:9):(p===1?5:6);return clean(cell(r,idx))}
function eqVal(s,st,subject){const raw=diagRaw(s,st,subject,2),m=raw.match(/\(([^)]+)\)/);if(m)return clean(m[1]);const pre=subject==='math'?'math':'lp';return clean(st[`${pre}Av2Equivalencia`]||st[`${pre}Equivalencia`])}
function eqRank(v){const f=fold(v),m=f.match(/(\d{1,2})/);if(!m)return 99;return Number(m[1])+(f.includes('SERIE')?9:0)}
function frequency(s,st){for(const r of matchingRows(s,'presenca',st)){const named=find(r,['Frequência anual','Frequencia anual','Frequência','Frequencia','% Frequência','(%) Frequência','Percentual de Frequência']);const x=num(clean(named)!==''?named:cell(r,4));if(x!==null)return x}return num(st.frequency??st.frequencia??st.participation)}
function ppValues(s,st,subject){const values={pp1:null,pp2:null,pp3:null};for(const k of['pp1','pp2','pp3']){for(const r of matchingRows(s,k,st)){if(!subjectMatches(r,subject))continue;const named=find(r,subject==='math'?['Matemática','% Acertos Matemática','Acertos Matemática','MAT']:['Língua Portuguesa','Português','% Acertos Português','Acertos Português','LP']);const fallback=cell(r,subject==='math'?4:5);const x=num(clean(named)!==''?named:fallback);if(x!==null){values[k]=x;break}}}const available=Object.values(values).filter(v=>v!==null);return{...values,avg:available.length?available.reduce((a,b)=>a+b,0)/available.length:null,count:available.length}}
function ppAvg(s,st,subject){return ppValues(s,st,subject).avg}
function sourceDate(s,k){const d=datasets(s.datasets)[k];return clean(d?.capturedAt||d?.captureAt||d?.updatedAt||'')}
function datePt(v){if(!v)return'Sem dado';try{return new Date(v).toLocaleString('pt-BR')}catch{return clean(v)}}
function saresp(s,st,subject){const rows=datasets(s.datasets).saresp?.rows||[],nm=fold(st.estudante);for(const r of rows){const rn=fold(find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome'])||cell(r,0));if(!nm||rn!==nm)continue;const named=find(r,subject==='math'?['Matemática','Nota Matemática','Resultado Matemática','MAT']:['Língua Portuguesa','Português','Nota Português','Resultado Português','LP']);const fallback=cell(r,subject==='math'?5:4);const n=Number(clean(clean(named)!==''?named:fallback).replace(',','.').replace(/[^0-9.-]/g,''));if(Number.isFinite(n))return n}return null}
function scoreSchool(s){const out=[],school=infer(s);for(const st of rebuild(s))for(const subject of['math','lp']){const a=diagRaw(s,st,subject,1),b=diagRaw(s,st,subject,2),fq=frequency(s,st),pps=ppValues(s,st,subject),pp=pps.avg,sa=saresp(s,st,subject),target=x=>level(x)==='Abaixo do Básico'||(state.criteria.avd==='below-basic'&&level(x)==='Básico'),flags={avd1:target(a),avd2:target(b),frequency:fq!==null&&fq<state.criteria.frequency,pp:pp!==null&&pp<state.criteria.pp,saresp:sa!==null&&sa<state.criteria.saresp},points=(flags.avd2?1.5:0)+(flags.avd1?1:0)+(flags.frequency?1:0)+(flags.pp?1:0)+(flags.saresp?1:0),eq=eqVal(s,st,subject),d=datasets(s.datasets);out.push({school,turma:clean(st.turma),ra:ra12(st.ra),name:clean(st.estudante),subject,avd1:a,avd2:b,frequency:fq,pp1:pps.pp1,pp2:pps.pp2,pp3:pps.pp3,pp,ppCount:pps.count,saresp:sa,points,priority:points>=2.5,equivalence:eq,equivalenceRank:eqRank(eq),order:Number(st._order||0),flags,trace:{avd:sourceDate(s,'avd')||sourceDate(s,'recomposicao')||sourceDate(s,'diagnosticas')||sourceDate(s,'diagnostica2')||sourceDate(s,'diagnostica1'),presenca:sourceDate(s,'presenca'),pp1:sourceDate(s,'pp1'),pp2:sourceDate(s,'pp2'),pp3:sourceDate(s,'pp3'),saresp:sourceDate(s,'saresp')}})}return out}
function allScores(){return Object.values(state.schools).flatMap(x=>scoreSchool(x.summary)).sort((a,b)=>Number(b.priority)-Number(a.priority)||b.points-a.points||a.equivalenceRank-b.equivalenceRank||a.order-b.order)}
function uniqueStudents(){const s=new Set;allScores().forEach(r=>s.add(`${r.school}|${r.ra||r.name+'|'+r.turma}`));return s.size}
function schoolSummary(){return Object.values(state.schools).map(x=>{const rows=scoreSchool(x.summary),keys=new Set(rows.map(r=>r.ra||r.name+'|'+r.turma)),pri=new Set(rows.filter(r=>r.priority).map(r=>r.ra||r.name+'|'+r.turma)),below=new Set(rows.filter(r=>level(r.avd2)==='Abaixo do Básico').map(r=>r.ra||r.name+'|'+r.turma)).size,priorityMath=new Set(rows.filter(r=>r.priority&&r.subject==='math').map(r=>r.ra||r.name+'|'+r.turma)).size,priorityLp=new Set(rows.filter(r=>r.priority&&r.subject==='lp').map(r=>r.ra||r.name+'|'+r.turma)).size,belowMath=new Set(rows.filter(r=>r.subject==='math'&&level(r.avd2)==='Abaixo do Básico').map(r=>r.ra||r.name+'|'+r.turma)).size,belowLp=new Set(rows.filter(r=>r.subject==='lp'&&level(r.avd2)==='Abaixo do Básico').map(r=>r.ra||r.name+'|'+r.turma)).size;return{school:x.schoolName,students:keys.size,priority:pri.size,priorityMath,priorityLp,below,belowMath,belowLp,coverage:coverage(x.summary)}}).sort((a,b)=>b.priority-a.priority||a.school.localeCompare(b.school))}
function coverage(s){const d=datasets(s.datasets),avd=!!(d.avd?.rows?.length||d.recomposicao?.rows?.length||d.diagnosticas?.rows?.length||d.diagnostica1?.rows?.length||d.diagnostica2?.rows?.length);return{avd,avd1:avd,avd2:avd,frequency:!!d.presenca?.rows?.length,pp1:!!d.pp1?.rows?.length,pp2:!!d.pp2?.rows?.length,pp3:!!d.pp3?.rows?.length,pp:['pp1','pp2','pp3'].filter(k=>d[k]?.rows?.length).length,saresp:!!d.saresp?.rows?.length}}
function sourceLabelFor(k){return({avd:'AvD',presenca:'Aluno Presente',pp1:'PP 1º bi',pp2:'PP 2º bi',pp3:'PP 3º bi',saresp:'SARESP'})[k]||k}
function rowTurma(r){return clean(r?._captureTurma||r?._selectedTurma||find(r||{},['Turma','Classe','Nome da Turma','NM_TURMA','Turma Consolidado']))}
function captureTurma(summary,candidate){const direct=clean(summary?.context?.turma);if(direct)return direct;const vals=[...new Set((candidate?.rows||[]).map(rowTurma).filter(Boolean))];return vals.length===1?vals[0]:''}
function captureItems(){const out=[];for(const x of Object.values(state.schools)){for(const c of x.summary?.captures||[])out.push({...c,school:c.school||x.schoolName})}return out.sort((a,b)=>String(b.capturedAt||'').localeCompare(String(a.capturedAt||'')))}
function captureMatrix(){const map=new Map;for(const c of captureItems()){const key=fold(c.school)+'|'+fold(c.turma),o=map.get(key)||{school:c.school,turma:c.turma,avd:false,presenca:false,pp1:false,pp2:false,pp3:false,saresp:false,last:''};if(c.source in o)o[c.source]=true;if(String(c.capturedAt||'')>o.last)o.last=c.capturedAt||'';map.set(key,o)}return[...map.values()].sort((a,b)=>a.school.localeCompare(b.school,'pt-BR')||a.turma.localeCompare(b.turma,'pt-BR'))}

nte</option><option value="pp1" ${state.filters.captureSource==='pp1'?'selected':''}>Prova Paulista · 1º bimestre</option><option value="pp2" ${state.filters.captureSource==='pp2'?'selected':''}>Prova Paulista · 2º bimestre</option><option value="pp3" ${state.filters.captureSource==='pp3'?'selected':''}>Prova Paulista · 3º bimestre</option><option value="saresp" ${state.filters.captureSource==='saresp'?'selected':''}>SARESP</option></select></label><button id="capture">Capturar fonte selecionada</button></section>`}
function visibleScores(){const q=fold(document.getElementById('fQuery')?.value||''),min=state.filters.points===''||state.filters.points==null?null:Number(state.filters.points);return allScores().filter(r=>(!state.filters.school||r.school===state.filters.school)&&(!state.filters.grade||grade(r.turma)===state.filters.grade)&&r.subject===state.filters.subject&&(state.filters.priority==='todos'||(state.filters.priority==='prioritarios'?r.priority:!r.priority))&&(!state.filters.level||level(r.avd2)===state.filters.level)&&(min===null||r.points>=min)&&(!q||fold(`${r.name} ${r.ra} ${r.turma}`).includes(q)))}

function render(){document.getElementById('schoolsPill').textContent=`🏫 ${Object.keys(state.schools).length} escolas`;document.getElementById('connector').textContent=state.connector?`🔌 Conector v${state.connector} · ativo`:'🔌 Aguardando conector';document.getElementById('nav').innerHTML=tabs.map(([id,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});const app=document.getElementById('app');let html='';if(state.captureNotice){html+=`<div class="notice">${state.captureNotice}</div>`}if(!Object.keys(state.schools).length&&state.tab!=='criterios'){html+=`<div class="notice"><b>Conexão com o Escola Total:</b> clique em “Abrir Escola Total”, faça o login, abra a escola e a fonte/Power BI desejados e volte ao SDF para usar “Capturar dados no SDF”. Cada captura é incorporada à escola correta.</div>`}if(state.tab==='panorama'){const ss=schoolSummary(),scores=allScores(),prior=new Set(scores.filter(r=>r.priority).map(r=>`${r.school}|${r.ra||r.name+'|'+r.turma}`)).size,below=new Set(scores.filter(r=>level(r.avd2)==='Abaixo do Básico').map(r=>`${r.school}|${r.ra||r.name+'|'+r.turma}`)).size;html+=filterBar()+`<section class="cards"><div class="card"><b>${ss.length}</b><span>Escolas consolidadas</span></div><div class="card"><b>${uniqueStudents()}</b><span>Estudantes</span></div><div class="card"><b>${prior}</b><span>Prioritários</span></div><div class="card"><b>${below}</b><span>Abaixo do Básico · AvD 2</span></div><div class="card"><b>${scores.filter(r=>r.priority&&r.subject==='math').length}</b><span>Sinais prioritários · MAT</span></div></section><section class="panel"><h2>Panorama por escola</h2><p>Consolidação regional baseada nos critérios definidos na planilha modelo.</p>${table(['Escola','Estudantes','Prioritários','Prior. MAT','Prior. LP','AB MAT','AB LP','AvD','Frequência','PP','SARESP'],ss.map(x=>[x.school,x.students,`<span if(state.tab==='escolas'){const ss=schoolSummary();html+=`<section class="panel"><h2>Escolas da URE-SAT</h2><p>Resumo da cobertura e quantidade de estudantes prioritários por unidade.</p>${table(['#','Escola','Estudantes','Prioritários','Abaixo do Básico','Cobertura'],ss.map((x,i)=>['#'+(i+1),x.school,x.students,`<span class="flag bad">${x.priority}</span>`,x.below,`${[x.coverage.avd1,x.coverage.avd2,x.coverage.frequency,x.coverage.pp>0,x.coverage.saresp].filter(Boolean).length}/5`]))}</section>`}
if(state.tab==='turmas'){const m=new Map;allScores().forEach(r=>{const k=`${r.school}|${r.turma}`,o=m.get(k)||{school:r.school,turma:r.turma,students:new Set,priority:new Set,priorityMath:new Set,priorityLp:new Set,belowMath:new Set,belowLp:new Set};const id=r.ra||r.name;o.students.add(id);if(r.priority)o.priority.add(id);if(r.priority&&r.subject==='math')o.priorityMath.add(id);if(r.priority&&r.subject==='lp')o.priorityLp.add(id);if(level(r.avd2)==='Abaixo do Básico'&&r.subject==='math')o.belowMath.add(id);if(level(r.avd2)==='Abaixo do Básico'&&r.subject==='lp')o.belowLp.add(id);m.set(k,o)});const rows=[...m.values()].sort((a,b)=>b.priority.size-a.priority.size||a.school.localeCompare(b.school)||a.turma.localeCompare(b.turma));html+=`<section class="panel"><h2>Turmas</h2><p>Distribuição regional por componente, preservando escola e turma de origem.</p>${table(['Escola','Turma','Estudantes','Prioritários','Prior. MAT','Prior. LP','AB MAT','AB LP'],rows.map(x=>[x.school,x.turma,x.students.size,`<span class="flag bad">${x.priority.size}</span>`,x.priorityMath.size,x.priorityLp.size,x.belowMath.size,x.belowLp.size]))}</section>`}

if(state.tab==='capturas'){const items=captureItems(),matrix=captureMatrix();html+=`<section class="panel"><h2>Capturas por turma</h2><p>Cada captura é registrada por <b>escola + turma + fonte</b>. Ao capturar novamente a mesma combinação, somente aquela captura é substituída.</p>${table(['Data/Hora','Escola','Turma','Fonte','Registros','Fonte detectada','Situação'],items.map(c=>[datePt(c.capturedAt),c.school,c.turma,sourceLabelFor(c.source),c.recordCount??'—',c.detectedSource||'Não identificada',c.sourceMatched===false?'<span class="flag bad">Conferir fonte</span>':'<span class="flag good">Salva</span>']))}</section><section class="panel"><h2>Cobertura por turma</h2><p>A matriz mostra o que já foi capturado para cada turma, sem misturar os segmentos.</p>${table(['Escola','Turma','AvD','Aluno Presente','PP1','PP2','PP3','SARESP','Última captura'],matrix.map(x=>[x.school,x.turma,x.avd?'✓':'—',x.presenca?'✓':'—',x.pp1?'✓':'—',x.pp2?'✓':'—',x.pp3?'✓':'—',x.saresp?'✓':'—',datePt(x.last)]))}</section>`}

app.innerHTML=html;bindFilters();bindActions()}
function bindFilters(){[['fSchool','school'],['fGrade','grade'],['fSubject','subject'],['fPriority','priority'],['fLevel','level'],['fCaptureSource','captureSource']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.onchange=()=>{state.filters[k]=e.value==='Todas'||e.value==='Todos'?'':e.value;render()}});const p=document.getElementById('fPoints');if(p)p.onchange=()=>{state.filters.points=p.value;render()};const q=document.getElementById('fQuery');if(q)q.oninput=()=>{if(state.tab==='prioritarios')render()};const c=document.getElementById('capture');if(c)c.onclick=captureCurrent}

function xmlEsc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function xlsSheet(name,rows){return `<Worksheet ss:Name="${xmlEsc(name).slice(0,31)}"><Table>${rows.map(row=>`<Row>${row.map(v=>`<Cell><Data ss:Type="${typeof v==='number'?'Number':'String'}">${xmlEsc(v)}</Data></Cell>`).join('')}</Row>`).join('')}</Table></Worksheet>`}
function exportExcel(){const scores=allScores(),schools=schoolSummary(),prior=scores.filter(r=>r.priority),others=scores.filter(r=>!r.priority),detailHead=['Escola','Turma','Estudante','RA','Componente','1ª AvD','2ª AvD','Equiv. 2ª AvD','Frequência','PP1','PP2','PP3','Média PP','SARESP','Pts AvD1','Pts AvD2','Pts Freq.','Pts PP','Pts SARESP','Total','Situação'];const detail=rows=>[detailHead,...rows.map(r=>[r.school,r.turma,r.name,r.ra,r.subject==='math'?'Matemática':'Língua Portuguesa',r.avd1||'Sem dado',r.avd2||'Sem dado',r.equivalence||'Sem dado',r.frequency??'Sem dado',r.pp1??'Sem dado',r.pp2??'Sem dado',r.pp3??'Sem dado',r.pp??'Sem dado',r.saresp??'Sem dado',r.flags.avd1?1:0,r.flags.avd2?1.5:0,r.flags.frequency?1:0,r.flags.pp?1:0,r.flags.saresp?1:0,r.points,r.priority?'PRIORITÁRIO':'Demais'])];const panorama=[['Indicador','Valor'],['Escolas',schools.length],['Estudantes',uniqueStudents()],['Estudantes prioritários',new Set(prior.map(r=>r.school+'|'+(r.ra||r.name+'|'+r.turma))).size],['Critério AvD',state.criteria.avd==='below'?'Abaixo do Básico':'Abaixo do Básico ou Básico'],['Frequência abaixo de (%)',state.criteria.frequency],['PP média abaixo de (%)',state.criteria.pp],['SARESP abaixo de',state.criteria.saresp],['Prioritário a partir de',2.5]];const schoolRows=[['Escola','Estudantes','Prioritários','Prior. MAT','Prior. LP','AB MAT','AB LP'],...schools.map(x=>[x.school,x.students,x.priority,x.priorityMath,x.priorityLp,x.belowMath,x.belowLp])];const coverageRows=[['Escola','AvD','Aluno Presente','PP1','PP2','PP3','SARESP'],...schools.map(x=>[x.school,x.coverage.avd?'Carregada':'Ausente',x.coverage.frequency?'Carregada':'Ausente',x.coverage.pp1?'Carregada':'Ausente',x.coverage.pp2?'Carregada':'Ausente',x.coverage.pp3?'Carregada':'Ausente',x.coverage.saresp?'Carregada':'Ausente'])];const dataRows=[['Escola','Fonte','Capturada em','Registros']];for(const x of Object.values(state.schools)){for(const [k,d] of Object.entries(datasets(x.summary.datasets))){dataRows.push([x.schoolName,k,d.capturedAt||'Sem data',Array.isArray(d.rows)?d.rows.length:0])}}const xml=`<?xml version="1.0"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">${xlsSheet('Panorama URE',panorama)}${xlsSheet('Escolas',schoolRows)}${xlsSheet('Estudantes Prioritários',detail(prior))}${xlsSheet('Demais Estudantes',detail(others))}${xlsSheet('Cobertura das Fontes',coverageRows)}${xlsSheet('Dados utilizados',dataRows)}</Workbook>`;download('super-diagnostico-facil-uresat.xls','\ufeff'+xml,'application/vnd.ms-excel')}
function download(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function openPortal(){state.captureNotice='Abrindo o Escola Total...';render();try{window.open('https://escolatotal.educacao.sp.gov.br/','_blank','noopener')}catch{}window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PORTAL',activate:true,requestId:'super-open-'+Date.now()},'*')}
function recoverExtensionContext(message){const msg=clean(message);if(!/extension context invalidated/i.test(msg))return false;const already=sessionStorage.getItem('sdf:context-recovery');if(already==='1'){state.captureNotice='A extensão foi recarregada, mas a ponte ainda não voltou. Atualize esta página uma vez e tente novamente.';render();return true}sessionStorage.setItem('sdf:context-recovery','1');state.captureNotice='A extensão foi atualizada/recarregada. Reconectando automaticamente...';render();setTimeout(()=>location.reload(),700);return true}
function captureCurrent(){if(!state.connector){state.captureNotice='Conector URE-SAT não detectado. Atualize a extensão e recarregue esta página.';render();return}const selected=state.filters.captureSource||'avd';const map={avd:{sessionSource:'diagnosticas',mode:'diagnosticas',label:'AvD · Recomposição/Diagnóstico (TURMA)'},presenca:{sessionSource:'presenca',mode:'aluno-presente',label:'Aluno Presente'},pp1:{sessionSource:'pp1',mode:'prova-paulista',label:'Prova Paulista · 1º bimestre'},pp2:{sessionSource:'pp2',mode:'prova-paulista',label:'Prova Paulista · 2º bimestre'},pp3:{sessionSource:'pp3',mode:'prova-paulista',label:'Prova Paulista · 3º bimestre'},saresp:{sessionSource:'saresp',mode:'saresp',label:'SARESP'}};const cfg=map[selected];state.captureNotice='Capturando '+cfg.label+'...';render();window.postMessage({source:'diagnostico-facil',type:'DIAG_CAPTURE_CURRENT_VIEW',requestId:'super-'+Date.now(),sessionSource:cfg.sessionSource,sessionId:'superdf-'+Date.now(),sourceLabel:cfg.label,mode:cfg.mode,destination:'sdf',destinationLabel:'SUPER Diagnóstico Fácil — URE-SAT',year:2026,manualCapture:true},'*')}
function normalizeCapture(data){if(!data||typeof data!=='object')return null;const selected=state.filters.captureSource||data.sourceId||'avd',all={...(data.datasets||{})};if(data.dataset&&Array.isArray(data.dataset.rows))all[data.dataset.key||data.dataset.label||'dataset']=data.dataset;const candidates={avd:['avd','recomposicao','diagnosticas','diagnostica1','diagnostica2','powerbiRaw'],presenca:['presenca','powerbiRaw'],pp1:['pp1','provaPaulista','powerbiRaw'],pp2:['pp2','provaPaulista','powerbiRaw'],pp3:['pp3','provaPaulista','powerbiRaw'],saresp:['saresp','powerbiRaw']}[selected]||[];let chosen=null;for(const k of candidates){const d=all[k];if(d&&Array.isArray(d.rows)&&d.rows.length&&(!chosen||d.rows.length>chosen.rows.length))chosen=d}const ds={};if(chosen){const labels={avd:'AvD · Recomposição/Diagnóstico (TURMA)',presenca:'Aluno Presente',pp1:'Prova Paulista · 1º bimestre',pp2:'Prova Paulista · 2º bimestre',pp3:'Prova Paulista · 3º bimestre',saresp:'SARESP'};ds[selected]={...chosen,key:selected,label:labels[selected],capturedAt:chosen.capturedAt||data.capturedAt||new Date().toISOString(),coverage:'fonte-confirmada-no-sdf'}}else Object.assign(ds,datasets(all));return{captureId:data.captureId||'',captureKey:data.captureKey||'',captureScope:data.captureScope||'turma',sourceId:data.sourceId||selected,sourceLabel:data.sourceLabel||sourceLabelFor(selected),detectedSource:data.detectedSource||data.context?.detectedSource||'',schoolName:clean(data.context?.school||data.schoolName||data.school||state.session.currentSchool||''),context:{...(data.context||{}),school:clean(data.context?.school||data.schoolName||data.school||state.session.currentSchool||'')},datasets:ds,studentRows:Array.isArray(data.studentRows)?data.studentRows:[]}}
function splitCaptureByTurma(summary,candidate){
  const contextTurma=clean(summary?.context?.turma||state.session.currentTurma||'');
  const groups=new Map(),untagged=[];
  for(const row of candidate.rows||[]){
    const turma=rowTurma(row);
    if(turma){
      const key=fold(turma),g=groups.get(key)||{turma,rows:[]};
      g.rows.push(row);groups.set(key,g);
    }else untagged.push(row);
  }
  if(!groups.size&&contextTurma)return[{turma:contextTurma,rows:[...(candidate.rows||[])]}];
  if(groups.size===1&&untagged.length){const g=[...groups.values()][0];g.rows.push(...untagged);return[g]}
  if(groups.size>1&&untagged.length)return[];
  return[...groups.values()];
}
function saveSchool(summary){
  const school=infer(summary)||clean(summary?.schoolName)||clean(summary?.context?.school);
  const selected=state.filters.captureSource||summary?.sourceId||'avd';
  const incoming=datasets(summary?.datasets||{}),candidate=incoming[selected];
  if(!school){state.captureNotice='Captura recebida, mas a escola não foi identificada. Confirme a escola no Escola Total e capture novamente.';render();return}
  if(!candidate||!Array.isArray(candidate.rows)||!candidate.rows.length){state.captureNotice='Captura rejeitada: a fonte selecionada não retornou registros válidos. A captura anterior foi preservada.';render();return}
  const groups=splitCaptureByTurma(summary,candidate);
  if(!groups.length){state.captureNotice='Captura rejeitada: vieram várias turmas e algumas linhas sem identificação de turma. Ajuste o filtro no Escola Total e capture novamente.';render();return}
  const id=fold(school).toLowerCase().replace(/[^a-z0-9]+/g,'-'),prev=state.schools[id]?.summary||{},prevDs=datasets(prev.datasets||{}),capturedAt=candidate.capturedAt||new Date().toISOString(),existing=prevDs[selected]?.rows||[];
  let mergedRows=[...existing],captures=[...(prev.captures||[])],total=0;
  const sourceMatched=!summary.detectedSource||(selected.startsWith('pp')&&summary.detectedSource==='prova-paulista')||summary.detectedSource===selected||(selected==='avd'&&summary.detectedSource==='avd');
  for(const group of groups){
    const turma=clean(group.turma);if(!turma)continue;
    const key=[fold(school),fold(turma),selected].join('::'),captureId=(summary.captureId||('sdf-'+Date.now()))+'-'+fold(turma).replace(/[^a-z0-9]+/g,'-');
    mergedRows=mergedRows.filter(r=>clean(r?._captureKey)!==key&&fold(rowTurma(r))!==fold(turma));
    const tagged=group.rows.map(r=>({...r,_captureKey:key,_captureId:captureId,_captureSource:selected,_captureSourceLabel:sourceLabelFor(selected),_captureSchool:school,_captureTurma:turma,_capturedAt:capturedAt,_detectedSource:summary.detectedSource||''}));
    mergedRows.push(...tagged);total+=tagged.length;
    const capture={captureKey:key,captureId,school,turma,source:selected,sourceLabel:sourceLabelFor(selected),detectedSource:summary.detectedSource||'',sourceMatched,capturedAt,recordCount:tagged.length,coverage:candidate.coverage||'',turmaId:clean(summary?.context?.turmaId||''),schoolCode:clean(summary?.context?.schoolCode||'')};
    captures=captures.filter(c=>c.captureKey!==key);captures.push(capture);
  }
  if(!total){state.captureNotice='Captura rejeitada: nenhuma turma válida foi identificada.';render();return}
  const mergedDataset={...(prevDs[selected]||{}),...candidate,key:selected,label:sourceLabelFor(selected),capturedAt,rows:mergedRows};
  const merged={...prev,...summary,schoolName:school,context:{...(prev.context||{}),...(summary.context||{}),school},datasets:{...prevDs,[selected]:mergedDataset},captures};
  merged.studentRows=rebuild(merged);
  state.schools[id]={id,schoolName:school,updatedAt:new Date().toISOString(),summary:merged};
  localStorage.setItem('superdf:schools:planilha:v1',JSON.stringify(state.schools));
  state.captureNotice=groups.length===1?school+' · '+groups[0].turma+' · '+sourceLabelFor(selected)+' salva com '+total.toLocaleString('pt-BR')+' registro(s).':school+' · '+groups.length+' turmas separadas automaticamente em '+sourceLabelFor(selected)+' · '+total.toLocaleString('pt-BR')+' registros.';
  state.tab='capturas';render();
}
function migrate(){try{state.criteria={...state.criteria,...JSON.parse(localStorage.getItem('superdf:criteria')||'{}')}}catch{}try{state.schools=JSON.parse(localStorage.getItem('superdf:schools:planilha:v1')||'{}')}catch{state.schools={}}}
window.addEventListener('message',e=>{const d=e.data||{};if(!['diagnostico-facil-extrator','escola-total-extrator','ure-sat-conector','ure-sat-escola-total'].includes(d.source))return;
if(d.type==='DF_READY'||d.type==='EXTRACTOR_READY'){sessionStorage.removeItem('sdf:context-recovery');state.connector=d.version||d.extensionVersion||d.payload?.version||'detectado';state.captureNotice='Conector detectado. Abra o Escola Total, escolha a escola e a fonte que deseja capturar.';window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_SESSION',requestId:'super-session-'+Date.now()},'*');render();return}
if(d.type==='DF_SESSION'||d.type==='ESCOLA_TOTAL_SESSION'){const s=d.session||d.payload?.session||{};state.session={loggedIn:!!s.loggedIn,currentSchool:clean(s.currentSchool),currentTurma:clean(s.currentTurma||s.turma),currentUre:clean(s.currentUre)};state.captureNotice=s.loggedIn?'Escola Total conectado'+(s.currentSchool?' · '+s.currentSchool:''):'Aguardando login no Escola Total.';render();return}
if(d.type==='ESCOLA_TOTAL_LOGIN_REQUIRED'){state.session.loggedIn=false;state.captureNotice='Faça o login oficial no Escola Total e depois volte ao SDF.';render();return}
if(d.type==='DF_SOURCE_SESSION_PROGRESS'||d.type==='DF_CAPTURE_PROGRESS'||d.type==='ESCOLA_TOTAL_FULL_CAPTURE_PROGRESS'){state.captureNotice=d.progress?.text||d.payload?.progress?.text||'Capturando Power BI...';render();return}
if(d.type==='DF_SOURCE_SESSION_ERROR'||d.type==='DF_ERROR'||d.type==='ESCOLA_TOTAL_ERROR'){const err=clean(d.error||d.payload?.error||'verifique a tela atual do Escola Total.');if(recoverExtensionContext(err))return;state.captureNotice='Falha na captura: '+err;render();return}
if(d.type==='DF_SOURCE_SESSION_UNAVAILABLE'){state.captureNotice='A tela atual não pôde ser lida. Abra a fonte/Power BI desejada no Escola Total e tente novamente.';render();return}
if(d.type==='DF_SOURCE_SESSION_DATA'||d.type==='DF_SOURCE_SESSION_COMPLETE'){const data=d.payload?.data;if(data){const s=normalizeCapture(data);if(s)saveSchool(s)}return}
if(d.type==='DF_DATA'||d.type==='ESCOLA_TOTAL_CAPTURE_DATA'||d.type==='ESCOLA_TOTAL_DATA'||d.type==='ESCOLA_TOTAL_MODULE_DATA'||d.type==='ESCOLA_TOTAL_COMBO_DATA'||d.type==='ESCOLA_TOTAL_FULL_CAPTURE_DATA'||d.type==='ESCOLA_TOTAL_FULL_CAPTURE_COMPLETE'){const p=d.payload||{},raw=p.biSummary||p.analysis||p.summary||p.data||(p.datasets||p.studentRows||p.dataset?p:null);const s=normalizeCapture(raw)||raw;if(s&&!s.regionMode)saveSchool(s);return}
});
setInterval(()=>window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING'},'*'),2500);
migrate();render();document.getElementById('collapseBtn')?.addEventListener('click',()=>document.querySelector('.shell')?.classList.toggle('collapsed'));document.getElementById('openPortalBtn')?.addEventListener('click',openPortal);window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING'},'*');window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_SESSION',requestId:'super-start-'+Date.now()},'*');
</script>
