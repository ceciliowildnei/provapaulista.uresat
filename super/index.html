<style>
:root{font-family:Inter,Segoe UI,Arial,sans-serif;color:#123f72;background:#eef8ff;--blue:#0757a8;--blue2:#0b73cd;--navy:#063d78;--green:#18a574;--yellow:#ffbe3d;--red:#ef5960;--line:#d9e8f4}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef8ff,#fbfdff);min-height:100vh}button,select,input{font:inherit}.shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#043f80,#075ca9 58%,#03467f);color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh}.brand{padding:10px 8px 22px;border-bottom:1px solid #ffffff24}.brand b{display:block;font-size:22px}.brand span{font-size:10px;letter-spacing:.15em;color:#d7edfb}.nav{display:grid;gap:5px;margin-top:18px}.nav button{border:0;background:transparent;color:#eaf5ff;padding:12px;border-radius:9px;text-align:left;font-weight:800;font-size:12px;cursor:pointer}.nav button.active{background:linear-gradient(90deg,#0b7bd8,#086bc2)}.side small{position:absolute;bottom:22px;left:22px;color:#d7edfb}.main{padding:0 24px 40px;min-width:0}.top{position:sticky;top:0;z-index:10;margin:0 -24px;padding:10px 24px;background:#ffffffef;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}.top strong{margin-right:auto}.pill{border:1px solid #cfe1ef;background:#fff;border-radius:99px;padding:8px 12px;font-size:11px;font-weight:800}.hero{padding:26px 4px 12px}.hero small{color:#0875d1;font-weight:900;letter-spacing:.12em}.hero h1{font-size:36px;margin:4px 0;color:#072e65}.hero h1 span{color:#0b73cd}.hero p{color:#607a94;margin:0}.toolbar{display:grid;grid-template-columns:repeat(5,minmax(130px,1fr)) auto;gap:8px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:10px 0 14px}.toolbar label{display:flex;flex-direction:column;gap:5px;font-size:9px;font-weight:800}.toolbar select,.toolbar input{height:38px;border:1px solid #cfe1ef;border-radius:8px;padding:0 9px;background:#fff;color:#123f72}.toolbar button,.actions button{border:0;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:800;padding:0 14px;cursor:pointer}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{min-height:105px;border-radius:12px;padding:14px;color:#fff;display:flex;flex-direction:column;justify-content:center}.card b{font-size:28px}.card span{font-size:10px;font-weight:800}.card:nth-child(1){background:linear-gradient(135deg,#0757a8,#0867bd)}.card:nth-child(2){background:linear-gradient(135deg,#1faa7a,#14a16f)}.card:nth-child(3){background:linear-gradient(135deg,#ffbf42,#ffb72d);color:#4c3800}.card:nth-child(4){background:linear-gradient(135deg,#ff6268,#ff555e)}.card:nth-child(5){background:linear-gradient(135deg,#6f62d9,#5a4eca)}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0;box-shadow:0 8px 20px #2d5e8810}.panel h2{margin:2px 0 4px;color:#103f72}.panel>p{margin:0 0 14px;color:#687f93;font-size:11px}.tablewrap{overflow:auto;border:1px solid #d9e7f3;border-radius:9px}.tablewrap table{border-collapse:collapse;width:100%;min-width:1000px}.tablewrap th{background:#e9f3fb;color:#163f70;font-size:9px;text-transform:uppercase}.tablewrap td{font-size:10px;color:#24486d}.tablewrap th,.tablewrap td{padding:9px;border-bottom:1px solid #e7edf3;text-align:left}.flag{display:inline-block;padding:4px 7px;border-radius:99px;font-size:9px;font-weight:800;background:#eef4f8}.flag.bad{background:#ffe8ea;color:#b3333d}.flag.good{background:#e9f8f1;color:#16714f}.sourcegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.source{border:1px solid #dfe9f2;border-radius:9px;padding:12px;background:#fbfdff}.source b{display:block;font-size:18px}.criteria{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.criteria label{border:1px solid #dfe9f2;border-radius:9px;padding:12px;background:#fbfdff;display:flex;flex-direction:column;gap:6px;font-size:10px;font-weight:800}.criteria input,.criteria select{height:36px;border:1px solid #cfe1ef;border-radius:7px;padding:0 8px;background:#fff}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions button{height:38px}.muted{color:#7b8d9e}.empty{text-align:center;padding:32px;color:#73869a}.notice{padding:10px 12px;border:1px solid #cfe2f3;background:#eef7ff;color:#155d98;border-radius:8px;font-size:10px;font-weight:700;margin:10px 0}
@media(max-width:1000px){.shell{grid-template-columns:210px 1fr}.toolbar{grid-template-columns:1fr 1fr}.cards{grid-template-columns:repeat(2,1fr)}.sourcegrid,.criteria{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.shell{display:block}.side{position:static;height:auto}.side small{display:none}.main{padding:0 10px 30px}.top{margin:0 -10px;padding:10px}.toolbar,.cards,.sourcegrid,.criteria{grid-template-columns:1fr}.hero h1{font-size:28px}}
</style>
</head>
<body>
<div class="shell">
<aside class="side"><div class="brand"><b>SUPER Diagnóstico Fácil</b><span>URESAT · inteligência regional</span></div><div class="nav" id="nav"></div><small>Planejar • Acompanhar • Transformar</small></aside>
<main class="main"><header class="top"><strong>URE-SAT · Recomposição</strong><span class="pill" id="connector">Conector aguardando</span><span class="pill" id="schoolsPill">0 escolas</span></header><section class="hero"><small>SUPER DIAGNÓSTICO FÁCIL · 2026</small><h1>Da escola para a URE.<br><span>Um diagnóstico consolidado.</span></h1><p>AvD, frequência, Prova Paulista e SARESP em uma única visão regional.</p></section><div id="app"></div></main>
</div>
<script>
const tabs=[['panorama','Panorama URE'],['escolas','Escolas'],['turmas','Turmas'],['prioritarios','Prioritários'],['fontes','Fontes e cobertura'],['criterios','Critérios']];
const state={tab:'panorama',schools:{},criteria:{avd:'below',frequency:75,pp:50,saresp:4,priority:2.5},filters:{school:'',grade:'',subject:'math',priority:'prioritarios'},connector:''};
const clean=v=>String(v??'').replace(/\s+/g,' ').trim();
const fold=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();
const digits=v=>clean(v).replace(/\D/g,'');
const fmt=v=>v==null||Number.isNaN(v)?'—':Number(v).toFixed(1).replace('.',',')+'%';
const num=v=>{if(v===null||v===undefined||v==='')return null;const raw=clean(v);let n=typeof v==='number'?v:Number(raw.replace('%','').replace(',','.').replace(/[^0-9.-]/g,''));if(!Number.isFinite(n))return null;if(!raw.includes('%')&&Math.abs(n)<=1)n*=100;return n};
const find=(r,names)=>{const e=Object.entries(r||{});for(const n of names){const f=fold(n),h=e.find(([k,v])=>fold(k)===f&&clean(v)!=='');if(h)return h[1]}for(const n of names){const f=fold(n),h=e.find(([k,v])=>f.length>2&&fold(k).includes(f)&&clean(v)!=='');if(h)return h[1]}return''};
const level=v=>{const f=fold(v);if(f.includes('ABAIXO'))return'Abaixo do Básico';if(f.includes('PROFICIENTE')||f.includes('ADEQUADO')||f.includes('AVANCADO'))return'Proficiente';if(f.includes('BASICO'))return'Básico';return clean(v)};
function canonicalKey(k,d){const m=fold(`${k} ${d?.key||''} ${d?.label||''}`);if(m.includes('PP1')||m.includes('PROVA PAULISTA 1'))return'pp1';if(m.includes('PP2')||m.includes('PROVA PAULISTA 2'))return'pp2';if(m.includes('PP3')||m.includes('PROVA PAULISTA 3'))return'pp3';if(m.includes('AVD 1')||m.includes('AVD1')||m.includes('DIAGNOSTICA 1'))return'diagnostica1';if(m.includes('AVD 2')||m.includes('AVD2')||m.includes('DIAGNOSTICA 2'))return'diagnostica2';if(m.includes('ALUNO PRESENTE')||m.includes('PRESENCA')||m.includes('FREQUENCIA'))return'presenca';if(m.includes('SARESP'))return'saresp';return k}
function datasets(input){const out={};Object.entries(input||{}).forEach(([k,d])=>{if(d&&Array.isArray(d.rows)){const c=canonicalKey(k,d);out[c]={...d,key:c}}});return out}
function infer(s){return clean(s?.schoolName)||clean(s?.studentRows?.[0]?.school)||clean(Object.values(s?.datasets||{}).flatMap(d=>d?.rows||[])[0]?._selectedSchool)}
function rowKey(r){return digits(r.ra||find(r,['NR RA','RA','Registro do Aluno','Matrícula']))||`${fold(r.estudante||find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome']))}|${fold(r.turma||find(r,['Turma','Classe','Turma Consolidado']))}`}
function rebuild(s){const sc=infer(s),m=new Map;const add=r=>{const k=rowKey(r);if(!k)return;const n={...r,school:clean(r.school||r._selectedSchool||find(r,['Escola','Unidade Escolar']))||sc,turma:clean(r.turma||r._selectedTurma||find(r,['Turma','Classe','Turma Consolidado'])),ra:digits(r.ra||find(r,['NR RA','RA','Registro do Aluno','Matrícula'])),estudante:clean(r.estudante||find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome']))};m.set(k,{...(m.get(k)||{}),...n})};(s.studentRows||[]).forEach(add);Object.values(datasets(s.datasets)).forEach(d=>(d.rows||[]).forEach(add));return[...m.values()]}
function matchingRows(s,k,st){const rows=datasets(s.datasets)[k]?.rows||[],ra=digits(st.ra),nm=fold(st.estudante),tu=fold(st.turma);return rows.filter(r=>{const rr=digits(find(r,['NR RA','RA','Registro do Aluno','Matrícula'])),rn=fold(find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome'])),rt=fold(find(r,['Turma','Classe','Turma Consolidado']));return ra&&rr?ra===rr:(nm&&rn===nm&&(!rt||!tu||rt===tu))})}
function subjectMatches(r,subject){const c=fold(find(r,['Componente','Disciplina','Área','Componente Curricular']));return !c||(subject==='math'?c.includes('MATEM'):c.includes('PORTUG'))}
function diagLevel(s,st,subject,p){const prop=subject==='math'?(p===1?'mathAv1Nivel':'mathAv2Nivel'):(p===1?'lpAv1Nivel':'lpAv2Nivel'),raw=st[prop]||st[prop.replace('Nivel','')];if(raw)return level(raw);for(const r of matchingRows(s,p===1?'diagnostica1':'diagnostica2',st)){if(!subjectMatches(r,subject))continue;const x=find(r,['Nível de Aprendizagem','Nível','Proficiência','Classificação','Resultado','Desempenho']);if(clean(x))return level(x)}return''}
function eqVal(s,st,subject){const prop=subject==='math'?'mathAv2Equivalencia':'lpAv2Equivalencia';if(clean(st[prop]))return clean(st[prop]);for(const r of matchingRows(s,'diagnostica2',st)){if(!subjectMatches(r,subject))continue;const x=find(r,['Aprendizagem Equivalente','Equivalência','Ano Equivalente']);if(clean(x))return clean(x)}return''}
function eqRank(v){const m=fold(v).match(/(\d{1,2})/);return m?Number(m[1]):99}
function frequency(s,st){for(const r of matchingRows(s,'presenca',st)){const x=num(find(r,['Frequência anual','Frequência','% Frequência','Presença','(%) Frequência']));if(x!==null)return x}return num(st.frequency??st.frequencia??st.participation)}
function ppAvg(s,st,subject){const a=[];for(const k of['pp1','pp2','pp3'])for(const r of matchingRows(s,k,st)){if(!subjectMatches(r,subject))continue;const x=num(find(r,['% Acertos','Acertos','Percentual de Acertos','Desempenho','Resultado']));if(x!==null){a.push(x);break}}return a.length?a.reduce((x,y)=>x+y,0)/a.length:null}
function saresp(s,st,subject){const rows=datasets(s.datasets).saresp?.rows||[],nm=fold(st.estudante);for(const r of rows){if(fold(find(r,['Nome do Aluno','Nome Estudante','Estudante','Aluno','Nome']))!==nm||!subjectMatches(r,subject))continue;const n=Number(clean(find(r,['Nota','Nota SARESP','Resultado','Proficiência','Escala'])).replace(',','.').replace(/[^0-9.-]/g,''));if(Number.isFinite(n))return n}return null}
function scoreSchool(s){const out=[],school=infer(s);for(const st of rebuild(s))for(const subject of['math','lp']){const a=diagLevel(s,st,subject,1),b=diagLevel(s,st,subject,2),fq=frequency(s,st),pp=ppAvg(s,st,subject),sa=saresp(s,st,subject),target=x=>x==='Abaixo do Básico'||(state.criteria.avd==='below-basic'&&x==='Básico'),flags={avd1:target(a),avd2:target(b),frequency:fq!==null&&fq<state.criteria.frequency,pp:pp!==null&&pp<state.criteria.pp,saresp:sa!==null&&sa<state.criteria.saresp},points=(flags.avd2?1.5:0)+(flags.avd1?1:0)+(flags.frequency?1:0)+(flags.pp?1:0)+(flags.saresp?1:0),eq=eqVal(s,st,subject);out.push({school,turma:clean(st.turma),ra:digits(st.ra),name:clean(st.estudante),subject,avd1:a,avd2:b,frequency:fq,pp,saresp:sa,points,priority:points>=state.criteria.priority,equivalence:eq,equivalenceRank:eqRank(eq),flags})}return out}
function allScores(){return Object.values(state.schools).flatMap(x=>scoreSchool(x.summary)).sort((a,b)=>Number(b.priority)-Number(a.priority)||b.points-a.points||a.equivalenceRank-b.equivalenceRank||a.name.localeCompare(b.name))}
function uniqueStudents(){const s=new Set;allScores().forEach(r=>s.add(`${r.school}|${r.ra||r.name+'|'+r.turma}`));return s.size}
function schoolSummary(){return Object.values(state.schools).map(x=>{const rows=scoreSchool(x.summary),keys=new Set(rows.map(r=>r.ra||r.name+'|'+r.turma)),pri=new Set(rows.filter(r=>r.priority).map(r=>r.ra||r.name+'|'+r.turma)),below=rows.filter(r=>r.avd2==='Abaixo do Básico').length;return{school:x.schoolName,students:keys.size,priority:pri.size,below,coverage:coverage(x.summary)}}).sort((a,b)=>b.priority-a.priority||a.school.localeCompare(b.school))}
function coverage(s){const d=datasets(s.datasets);return{avd1:!!d.diagnostica1?.rows?.length,avd2:!!d.diagnostica2?.rows?.length,frequency:!!d.presenca?.rows?.length,pp:['pp1','pp2','pp3'].filter(k=>d[k]?.rows?.length).length,saresp:!!d.saresp?.rows?.length}}
function grade(t){const m=clean(t).match(/(\d{1,2})/);return m?m[1]+'º':''}
function table(heads,rows){return `<div class="tablewrap"><table><thead><tr>${heads.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'—'}</td>`).join('')}</tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Ainda não há dados para este recorte.</div>'}</div>`}
function filterBar(){const schools=['',...Object.values(state.schools).map(x=>x.schoolName).sort()],grades=['',...new Set(allScores().map(r=>grade(r.turma)).filter(Boolean))];return `<section class="toolbar"><label>Escola<select id="fSchool">${schools.map(x=>`<option ${state.filters.school===x?'selected':''}>${x||'Todas'}</option>`).join('')}</select></label><label>Ano/Série<select id="fGrade">${grades.map(x=>`<option ${state.filters.grade===x?'selected':''}>${x||'Todos'}</option>`).join('')}</select></label><label>Componente<select id="fSubject"><option value="math" ${state.filters.subject==='math'?'selected':''}>Matemática</option><option value="lp" ${state.filters.subject==='lp'?'selected':''}>Língua Portuguesa</option></select></label><label>Situação<select id="fPriority"><option value="prioritarios" ${state.filters.priority==='prioritarios'?'selected':''}>Prioritários</option><option value="todos" ${state.filters.priority==='todos'?'selected':''}>Todos</option></select></label><label>Busca<input id="fQuery" placeholder="Estudante, RA ou turma"></label><button id="capture">Captar escola atual</button></section>`}
function visibleScores(){const q=fold(document.getElementById('fQuery')?.value||'');return allScores().filter(r=>(!state.filters.school||r.school===state.filters.school)&&(!state.filters.grade||grade(r.turma)===state.filters.grade)&&r.subject===state.filters.subject&&(state.filters.priority==='todos'||r.priority)&&(!q||fold(`${r.name} ${r.ra} ${r.turma}`).includes(q)))}
function render(){document.getElementById('schoolsPill').textContent=`${Object.keys(state.schools).length} escolas`;document.getElementById('connector').textContent=state.connector?`Conector v${state.connector}`:'Conector aguardando';document.getElementById('nav').innerHTML=tabs.map(([id,l])=>`<button data-tab="${id}" class="${state.tab===id?'active':''}">${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;render()});const app=document.getElementById('app');let html='';if(!Object.keys(state.schools).length&&state.tab!=='criterios'){html=`<div class="notice">Abra o Diagnóstico Fácil no mesmo navegador e use “Captar escola atual” após o conector estar ativo. O Super também tenta importar automaticamente escolas já salvas pelo Diagnóstico Fácil.</div>`}if(state.tab==='panorama'){const ss=schoolSummary(),scores=allScores(),prior=new Set(scores.filter(r=>r.priority).map(r=>`${r.school}|${r.ra||r.name+'|'+r.turma}`)).size,below=new Set(scores.filter(r=>r.avd2==='Abaixo do Básico').map(r=>`${r.school}|${r.ra||r.name+'|'+r.turma}`)).size;html+=filterBar()+`<section class="cards"><div class="card"><b>${ss.length}</b><span>Escolas consolidadas</span></div><div class="card"><b>${uniqueStudents()}</b><span>Estudantes</span></div><div class="card"><b>${prior}</b><span>Prioritários</span></div><div class="card"><b>${below}</b><span>Abaixo do Básico · AvD 2</span></div><div class="card"><b>${scores.filter(r=>r.priority&&r.subject==='math').length}</b><span>Sinais prioritários · MAT</span></div></section><section class="panel"><h2>Panorama por escola</h2><p>Consolidação regional baseada nos critérios definidos na planilha modelo.</p>${table(['Escola','Estudantes','Prioritários','Abaixo do Básico','AvD1','AvD2','Frequência','PP','SARESP'],ss.map(x=>[x.school,x.students,`<span class="flag bad">${x.priority}</span>`,x.below,x.coverage.avd1?'✓':'—',x.coverage.avd2?'✓':'—',x.coverage.frequency?'✓':'—',x.coverage.pp+'/3',x.coverage.saresp?'✓':'—']))}</section>`}
if(state.tab==='escolas'){const ss=schoolSummary();html+=`<section class="panel"><h2>Escolas da URE-SAT</h2><p>Resumo da cobertura e quantidade de estudantes prioritários por unidade.</p>${table(['#','Escola','Estudantes','Prioritários','Abaixo do Básico','Cobertura'],ss.map((x,i)=>['#'+(i+1),x.school,x.students,`<span class="flag bad">${x.priority}</span>`,x.below,`${[x.coverage.avd1,x.coverage.avd2,x.coverage.frequency,x.coverage.pp>0,x.coverage.saresp].filter(Boolean).length}/5`]))}</section>`}
if(state.tab==='turmas'){const m=new Map;allScores().forEach(r=>{if(r.subject!=='math')return;const k=`${r.school}|${r.turma}`,o=m.get(k)||{school:r.school,turma:r.turma,students:new Set,priority:new Set,below:new Set};const id=r.ra||r.name;o.students.add(id);if(r.priority)o.priority.add(id);if(r.avd2==='Abaixo do Básico')o.below.add(id);m.set(k,o)});const rows=[...m.values()].sort((a,b)=>b.priority.size-a.priority.size);html+=`<section class="panel"><h2>Turmas</h2><p>Recorte regional para localizar turmas com maior concentração de estudantes prioritários.</p>${table(['Escola','Turma','Estudantes','Prioritários','Abaixo do Básico'],rows.map(x=>[x.school,x.turma,x.students.size,`<span class="flag bad">${x.priority.size}</span>`,x.below.size]))}</section>`}
if(state.tab==='prioritarios'){html+=filterBar();setTimeout(bindFilters,0);const rows=visibleScores();html+=`<section class="panel"><h2>Estudantes prioritários</h2><p>2ª AvD = 1,5 ponto; 1ª AvD, frequência, PP e SARESP = 1 ponto. Prioritário ≥ ${state.criteria.priority.toFixed(1).replace('.',',')}.</p>${table(['Escola','Turma','Estudante','RA','AvD 1','AvD 2','Frequência','PP média','SARESP','Pontos','Equivalência'],rows.map(r=>[r.school,r.turma,r.name,r.ra||'—',r.avd1||'—',r.avd2||'—',fmt(r.frequency),fmt(r.pp),r.saresp??'—',`<span class="flag ${r.priority?'bad':'good'}">${r.points.toFixed(1).replace('.',',')}</span>`,r.equivalence||'—']))}</section>`}
if(state.tab==='fontes'){const ss=schoolSummary();html+=`<section class="panel"><h2>Fontes e cobertura</h2><p>Verifique quais bases já foram capturadas para cada escola.</p><div class="sourcegrid"><div class="source"><b>AvD 1</b><span>${ss.filter(x=>x.coverage.avd1).length}/${ss.length} escolas</span></div><div class="source"><b>AvD 2</b><span>${ss.filter(x=>x.coverage.avd2).length}/${ss.length} escolas</span></div><div class="source"><b>Frequência</b><span>${ss.filter(x=>x.coverage.frequency).length}/${ss.length} escolas</span></div><div class="source"><b>PP</b><span>${ss.reduce((a,x)=>a+x.coverage.pp,0)} bases</span></div><div class="source"><b>SARESP</b><span>${ss.filter(x=>x.coverage.saresp).length}/${ss.length} escolas</span></div></div></section>`}
if(state.tab==='criterios'){html+=`<section class="panel"><h2>Critérios de priorização</h2><p>Valores da planilha modelo. Ajuste apenas quando necessário para uma análise específica.</p><div class="criteria"><label>AvD<select id="cAvd"><option value="below" ${state.criteria.avd==='below'?'selected':''}>Abaixo do Básico</option><option value="below-basic" ${state.criteria.avd==='below-basic'?'selected':''}>Abaixo do Básico ou Básico</option></select></label><label>Frequência abaixo de (%)<input id="cFreq" type="number" value="${state.criteria.frequency}"></label><label>PP média abaixo de (%)<input id="cPP" type="number" value="${state.criteria.pp}"></label><label>SARESP abaixo de<input id="cSar" type="number" step="0.1" value="${state.criteria.saresp}"></label><label>Prioritário a partir de<input id="cPri" type="number" step="0.5" value="${state.criteria.priority}"></label></div><div class="actions"><button id="saveCrit">Salvar critérios</button><button id="exportJson">Backup regional JSON</button><button id="exportCsv">Exportar prioritários CSV</button></div></section>`}
app.innerHTML=html;bindFilters();bindActions()}
function bindFilters(){[['fSchool','school'],['fGrade','grade'],['fSubject','subject'],['fPriority','priority']].forEach(([id,k])=>{const e=document.getElementById(id);if(e)e.onchange=()=>{state.filters[k]=e.value==='Todas'||e.value==='Todos'?'':e.value;render()}});const q=document.getElementById('fQuery');if(q)q.oninput=()=>{if(state.tab==='prioritarios')render()};const c=document.getElementById('capture');if(c)c.onclick=captureCurrent}
function bindActions(){const b=document.getElementById('saveCrit');if(b)b.onclick=()=>{state.criteria={avd:document.getElementById('cAvd').value,frequency:Number(document.getElementById('cFreq').value),pp:Number(document.getElementById('cPP').value),saresp:Number(document.getElementById('cSar').value),priority:Number(document.getElementById('cPri').value)};localStorage.setItem('superdf:criteria',JSON.stringify(state.criteria));render()};const j=document.getElementById('exportJson');if(j)j.onclick=()=>download('super-diagnostico-facil-uresat-backup.json',JSON.stringify({savedAt:new Date().toISOString(),criteria:state.criteria,schools:state.schools},null,2),'application/json');const c=document.getElementById('exportCsv');if(c)c.onclick=()=>{const rows=allScores().filter(r=>r.priority),head=['Escola','Turma','Estudante','RA','Componente','AvD1','AvD2','Frequencia','PP','SARESP','Pontos','Equivalencia'],csv=[head,...rows.map(r=>[r.school,r.turma,r.name,r.ra,r.subject==='math'?'Matemática':'Língua Portuguesa',r.avd1,r.avd2,r.frequency??'',r.pp??'',r.saresp??'',r.points,r.equivalence])].map(x=>x.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(';')).join('\n');download('super-diagnostico-prioritarios.csv','\ufeff'+csv,'text/csv')};}
function download(n,t,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
let activeCaptureRequest='';
function captureCurrent(){
  activeCaptureRequest='super-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);
  state.connector=state.connector||'ativo';
  render();
  window.postMessage({source:'diagnostico-facil',type:'DIAG_CAPTURE_CURRENT_VIEW',requestId:activeCaptureRequest,sessionId:'super-session-'+Date.now(),sessionSource:'superbi',sourceLabel:'Super BI',mode:'super-bi',year:2026,manualCapture:true},location.origin);
}
function saveSchool(summary){const school=infer(summary);if(!school)return;const id=fold(school).toLowerCase().replace(/[^a-z0-9]+/g,'-');state.schools[id]={id,schoolName:school,updatedAt:new Date().toISOString(),summary:{...summary,schoolName:school,datasets:datasets(summary.datasets),studentRows:rebuild(summary)}};localStorage.setItem('superdf:schools',JSON.stringify(state.schools));render()}
function migrate(){try{state.criteria={...state.criteria,...JSON.parse(localStorage.getItem('superdf:criteria')||'{}')}}catch{}try{state.schools=JSON.parse(localStorage.getItem('superdf:schools')||'{}')}catch{}try{const x=JSON.parse(localStorage.getItem('df:vercel:original:v1')||'null');if(x&&infer(x))saveSchool(x)}catch{}try{const idx=JSON.parse(localStorage.getItem('df:vercel:schools:index:v1')||'[]');for(const i of idx){try{const x=JSON.parse(localStorage.getItem('df:vercel:school:'+i.id)||'null');if(x&&infer(x))saveSchool(x)}catch{}}}catch{}}
window.addEventListener('message',e=>{
  if(e.source!==window)return;
  const d=e.data||{};
  if(!['diagnostico-facil-extrator','escola-total-extrator','ure-sat-conector','ure-sat-escola-total'].includes(d.source))return;
  if(d.type==='DF_READY'){
    state.connector=d.version||d.extensionVersion||d.manifest?.version||'ativo';
    render();
    window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_SESSION',requestId:'super-session-'+Date.now()},location.origin);
    return;
  }
  if(d.type==='DF_SESSION'){
    if(d.session?.loggedIn) state.connector=d.version||d.extensionVersion||state.connector||'ativo';
    render();
    return;
  }
  if(d.type==='EXTRACTOR_READY'){
    state.connector=d.version||'ativo';
    render();
    return;
  }
  if(activeCaptureRequest&&d.requestId===activeCaptureRequest&&d.type==='DF_SOURCE_SESSION_DATA'){
    const x=d.payload?.data||d.data||d.payload||{};
    if(x&&typeof x==='object'){
      const s=x.biSummary||x.analysis||x.summary||(x.datasets||x.studentRows?x:null);
      if(s&&!s.regionMode)saveSchool(s);
    }
    return;
  }
  if(activeCaptureRequest&&d.requestId===activeCaptureRequest&&d.type==='DF_SOURCE_SESSION_COMPLETE'){
    const x=d.payload?.data||d.data||{};
    const s=x.biSummary||x.analysis||x.summary||(x.datasets||x.studentRows?x:null);
    if(s&&!s.regionMode)saveSchool(s);
    activeCaptureRequest='';
    return;
  }
  if(activeCaptureRequest&&d.requestId===activeCaptureRequest&&d.type==='DF_SOURCE_SESSION_ERROR'){
    activeCaptureRequest='';
    alert(d.error||d.payload?.error||d.payload?.reason||'Não foi possível captar a tela atual do Escola Total.');
    return;
  }
  if(['ESCOLA_TOTAL_DATA','ESCOLA_TOTAL_MODULE_DATA','ESCOLA_TOTAL_COMBO_DATA','ESCOLA_TOTAL_CAPTURE_DATA','ESCOLA_TOTAL_FULL_CAPTURE_DATA','ESCOLA_TOTAL_FULL_CAPTURE_COMPLETE'].includes(d.type)&&d.payload){
    const p=d.payload,s=p.biSummary||p.analysis||p.summary||(p.datasets||p.studentRows?p:null);
    if(s&&!s.regionMode)saveSchool(s);
  }
});
setInterval(()=>window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING',requestId:'super-ping-'+Date.now()},location.origin),2500);
migrate();render();window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING',requestId:'super-ping-'+Date.now()},location.origin);setTimeout(()=>window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_SESSION',requestId:'super-session-'+Date.now()},location.origin),300);
</script>
