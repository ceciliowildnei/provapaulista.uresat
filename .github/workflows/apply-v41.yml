name: Apply Diagnostico v4.1

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-v41.yml'
      - '.github/scripts/apply_v41.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic patch
        run: python .github/scripts/apply_v41.py
      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Diagnostico Facil v4.1 fluxo automatico e status"
          git push
