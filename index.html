cola</th><th>Turma</th><th>Estudante</th><th>PP1 LP</th><th>PP2 LP</th><th>PP3 LP</th><th>PP1 MAT</th><th>PP2 MAT</th><th>PP3 MAT</th><th>Frequência</th></tr></thead><tbody>${r.map(x=>`<tr><td>${esc(x.school)}</td><td>${esc(x.className)}</td><td><strong>${esc(x.name)}</strong><br><small>${esc(x.ra)}</small></td><td>${fmt(x.p1l)}</td><td>${fmt(x.p2l)}</td><td>${fmt(x.p3l)}</td><td>${fmt(x.p1m)}</td><td>${fmt(x.p2m)}</td><td>${fmt(x.p3m)}</td><td class="${Number.isFinite(x.att)&&x.att<80?'bad':''}">${fmt(x.att)}</td></tr>`).join('')}</tbody></table></div></section>`}function questions(){return`<section class="panel"><div class="ph"><div><h2>Pergunte aos dados</h2><p>A resposta usa somente as bases capturadas.</p></div></div><div class="qbox"><div class="qrow"><input id="qinput" placeholder="Ex.: Por que esta escola caiu na Prova Paulista?"><button data-a="ask">Analisar</button></div><div class="qs"><button data-q="Por que o índice está ruim?">Por que o índice está ruim?</button><button data-q="A frequência pode estar associada ao desempenho?">Frequência × desempenho</button><button data-q="O planejamento ou PDA pode estar relacionado?">Planejamento / PDA</button><button data-q="Quais turmas precisam de prioridade?">Turmas prioritárias</button><button data-q="O indicador do professor tem associação com o resultado?">Indicador docente</button></div>${s.answer?`<div class="answer">${esc(s.answer)}</div>`:''}</div></section>`}function coverage(){if(!s.summary)return empty();const d=s.summary.datasets||{};return`<section class="panel"><div class="ph"><div><h2>Cobertura das fontes do Escola Total</h2><p>Veja o que já foi capturado e o que falta para completar os cruzamentos.</p></div></div><div class="coverage">${MOD.map(([k,l])=>{const n=d[k]?.rows?.length||0;return`<div class="src ${n?'ready':''}"><span>${n?'CAPTURADO':'PENDENTE'}</span><strong>${esc(l)}</strong><small>${n.toLocaleString('pt-BR')} registros</small><button data-cap="${k}" data-lab="${esc(l)}">${n?'Recaptar':'Captar'}</button></div>`}).join('')}</div></section>`}function body(){return s.tab==='comparacoes'?comparisons():s.tab==='fatores'?factors():s.tab==='escolas'?schoolView():s.tab==='turmas'?classes():s.tab==='estudantes'?students():s.tab==='perguntas'?questions():s.tab==='fontes'?coverage():panorama()}function render(){const S=schools();if(s.school!=='Todas'&&!S.includes(s.school))s.school='Todas';const U=uniq([...(s.cat.ures||[]),s.cat.selectedUre,s.ure]).filter(Boolean),c=ctx();app.innerHTML=`<header class="top"><div class="brand"><div class="logo">DF</div><div><b>Diagnóstico Fácil</b><small>INTELIGÊNCIA PEDAGÓGICA · URE-SAT</small></div></div><div class="status"><span class="pill ${s.ext?'ok':''}"><i></i>${s.ext?`Conector v${esc(s.ext)}`:'Conector não detectado'}</span><span class="pill ${s.session.loggedIn?'ok':''}"><i></i>${s.session.loggedIn?'Escola Total conectado':'Aguardando login'}</span><button data-a="connect">${s.session.loggedIn?'Abrir Escola Total':'Conectar Escola Total'}</button></div></header><div class="shell"><aside><div class="navtitle">ANÁLISE</div><nav>${[['panorama','◫','Panorama'],['comparacoes','⇄','Comparações PP'],['fatores','◎','Fatores associados'],['escolas','🏫','Escolas'],['turmas','▦','Turmas'],['estudantes','👤','Estudantes'],['perguntas','?','Pergunte aos dados'],['fontes','⌁','Fontes e cobertura']].map(([id,ic,l])=>`<button data-tab="${id}" class="${s.tab===id?'on':''}"><span class="ic">${ic}</span>${l}</button>`).join('')}</nav><div class="sidefoot">Resultados para decisão pedagógica.<br>Associação estatística não é causalidade.</div></aside><main><section class="hero"><div class="heroa"><span class="ey">ESCOLA TOTAL → URE → ESCOLA → TURMA → ESTUDANTE</span><h1>Instrumentalize os resultados, não apenas visualize números.</h1><p>Compare avaliações, encontre regressões e cruze desempenho com frequência, planejamento/PDA, indicadores docentes, tarefas e recomposição.</p></div><div class="herob"><span>RECORTE ATUAL</span><strong>${esc(s.school==='Todas'?(s.ure||s.summary?.schoolName||'Unidade Regional'):s.school)}</strong><p>${s.school==='Todas'?`${c.schools} escolas no recorte regional`:'Análise detalhada da unidade selecionada'}</p><button data-a="connect">${s.session.loggedIn?'Atualizar conexão':'Vincular Escola Total'}</button></div></section><section class="filters"><label class="f"><span>UNIDADE REGIONAL</span><select data-a="ure"><option value="">${U.length?'Selecione a URE':'Carregar do Escola Total'}</option>${U.map(x=>`<option ${x===s.ure?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="f"><span>ESCOLA</span><select data-a="school"><option value="Todas">Todas as escolas da URE</option>${S.map(x=>`<option value="${esc(x)}" ${x===s.school?'selected':''}>${esc(x)}</option>`).join('')}</select></label><label class="f"><span>FONTE</span><select data-a="source">${SOURCES.map(x=>`<option value="${x[0]}" ${x[0]===s.source?'selected':''}>${x[1]}</option>`).join('')}</select></label><label class="f"><span>ANO</span><select><option>2026</option></select></label><button class="go" data-a="collect" ${s.progress?'disabled':''}>${s.progress?'Captando...':'Atualizar dados'}</button></section>${s.notice?`<div class="note">${esc(s.notice)}</div>`:''}${s.error?`<div class="note err">${esc(s.error)}</div>`:''}${s.progress?`<div class="note">⟳ ${esc(s.progress)}</div>`:''}${s.summary?metrics():''}${body()}</main></div><div class="footer">Diagnóstico Fácil · Inteligência Pedagógica · URE-SAT</div>`;bind()}function bind(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{s.tab=b.dataset.tab;s.answer='';render()});document.querySelectorAll('[data-a="connect"]').forEach(b=>b.onclick=connect);document.querySelectorAll('[data-a="demo"]').forEach(b=>b.onclick=demo);const u=document.querySelector('[data-a="ure"]');if(u)u.onchange=e=>{s.ure=e.target.value;s.school='Todas';window.postMessage({source:'diagnostico-facil',type:'DIAG_SELECT_URE',ureName:s.ure},'*');render()};const sc=document.querySelector('[data-a="school"]');if(sc)sc.onchange=e=>{s.school=e.target.value;if(s.school!=='Todas')window.postMessage({source:'diagnostico-facil',type:'DIAG_SELECT_SCHOOL',schoolName:s.school,autoCapture:false},'*');render()};const so=document.querySelector('[data-a="source"]');if(so)so.onchange=e=>{s.source=e.target.value;render()};const co=document.querySelector('[data-a="collect"]');if(co)co.onclick=collect;document.querySelectorAll('[data-c]').forEach(x=>x.onchange=e=>{s[x.dataset.c]=e.target.value;render()});const se=document.querySelector('[data-search]');if(se)se.oninput=e=>{s.q=e.target.value;const p=e.target.selectionStart;render();const n=document.querySelector('[data-search]');if(n){n.focus();n.setSelectionRange(p,p)}};const ask=document.querySelector('[data-a="ask"]');if(ask)ask.onclick=()=>{s.answer=explain(document.getElementById('qinput')?.value||'');render()};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{s.answer=explain(b.dataset.q);render()});document.querySelectorAll('[data-cap]').forEach(b=>b.onclick=()=>collectOne(b.dataset.cap,b.dataset.lab))}window.addEventListener('message',e=>{const d=e.data;if(!d||!['diagnostico-facil-extrator','escola-total-extrator','ure-sat-conector','ure-sat-escola-total'].includes(d.source||''))return;if(d.type==='EXTRACTOR_READY'){s.ext=d.version||'';request();render();return}if(d.type==='ESCOLA_TOTAL_SESSION'){s.session={...s.session,...(d.session||{})};render();return}if(d.type==='ESCOLA_TOTAL_CATALOG'&&d.catalog){s.cat={...s.cat,...d.catalog};if(d.catalog.selectedUre&&!s.ure)s.ure=d.catalog.selectedUre;render();return}if(d.type==='ESCOLA_TOTAL_SCHOOL_SELECTED'){const x=d.selectedSchool||d.session?.currentSchool;if(x)s.school=x;render();return}if(['ESCOLA_TOTAL_PROGRESS','ESCOLA_TOTAL_COMBO_PROGRESS','ESCOLA_TOTAL_FULL_CAPTURE_PROGRESS'].includes(d.type)){s.progress=d.progress?.text||'Captando dados...';render();return}if(d.type==='ESCOLA_TOTAL_LOGIN_REQUIRED'){s.notice='Conclua o login oficial no Escola Total. A captura continua depois do login.';s.progress='';render();return}if(d.type==='ESCOLA_TOTAL_ERROR'){s.error=d.error||'O conector não conseguiu concluir a operação.';s.progress='';render();return}if(['ESCOLA_TOTAL_DATA','ESCOLA_TOTAL_MODULE_DATA','ESCOLA_TOTAL_COMBO_DATA','ESCOLA_TOTAL_CAPTURE_DATA','ESCOLA_TOTAL_FULL_CAPTURE_DATA','ESCOLA_TOTAL_FULL_CAPTURE_COMPLETE'].includes(d.type)&&d.payload){merge(d.payload);return}if(d.type==='ESCOLA_TOTAL_FULL_CAPTURE_COMPLETE'){s.progress='';s.notice='Captação concluída.';render()}});try{const p=JSON.parse(localStorage.getItem(STORE)||'null');if(p?.biSummary)s.summary=p.biSummary}catch{}render();window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING'},'*');request();setInterval(()=>{window.postMessage({source:'diagnostico-facil',type:'DIAG_REQUEST_PING'},'*');request()},8000)})();
</script></body></html>
